name: GitHub Profile Stats

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 3
          AUTO_PUSH: true
          THEME: "tokyonight"
          ANIMATION: "load"
          DURATION: "3"
          NAME: "Omar Ahmed"
